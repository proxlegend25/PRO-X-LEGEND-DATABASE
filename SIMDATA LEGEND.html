<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROXLEGEND OFFICIAL - Grow Your Channel & Community</title>
    <meta name="description" content="Promote your channels and grow your community with ProxArmy Team">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0a0a16;
            --secondary: #12122e;
            --accent: #0f3460;
            --highlight: #e94560;
            --text: #ffffff;
            --text-secondary: #b8b8b8;
            --success: #4CAF50;
            --error: #f44336;
            --warning: #ff9800;
            --card-bg: rgba(255, 255, 255, 0.05);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            --glow: 0 0 15px rgba(233, 69, 96, 0.4);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 2rem;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }
        
        header {
            background-color: rgba(10, 10, 20, 0.95);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 0;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            cursor: pointer;
            transition: transform 0.3s;
            user-select: none;
        }
        
        .logo:hover {
            transform: scale(1.05);
        }
        
        .logo i {
            color: var(--highlight);
            font-size: 1.8rem;
            text-shadow: var(--glow);
        }
        
        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--highlight), #ff7b9c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.3);
        }
        
        .nav-links {
            display: flex;
            gap: 2rem;
        }
        
        .nav-links a {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
            padding: 0.5rem 0;
        }
        
        .nav-links a:hover {
            color: var(--highlight);
        }
        
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(to right, var(--accent), var(--highlight));
            transition: width 0.3s;
        }
        
        .nav-links a:hover::after {
            width: 100%;
        }
        
        .hero {
            text-align: center;
            padding: 6rem 0 4rem;
            position: relative;
            overflow: hidden;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(233, 69, 96, 0.1) 0%, rgba(10, 10, 20, 0) 70%);
            z-index: -1;
        }
        
        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, #fff, var(--highlight));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
            line-height: 1.2;
        }
        
        .hero p {
            font-size: 1.3rem;
            max-width: 700px;
            margin: 0 auto 2.5rem;
            color: var(--text-secondary);
        }
        
        .cta-button {
            display: inline-block;
            background: linear-gradient(to right, var(--accent), var(--highlight));
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        
        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, var(--highlight), var(--accent));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .cta-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(233, 69, 96, 0.6);
        }
        
        .cta-button:hover::before {
            opacity: 1;
        }
        
        .section-title {
            text-align: center;
            margin: 4rem 0 3rem;
            font-size: 2.5rem;
            position: relative;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(to right, var(--accent), var(--highlight));
            border-radius: 2px;
            box-shadow: var(--glow);
        }
        
        .form-container {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: var(--shadow);
            max-width: 800px;
            margin: 0 auto 4rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .form-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, var(--accent), var(--highlight));
        }
        
        .form-group {
            margin-bottom: 2rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
        
        .form-control {
            width: 100%;
            padding: 1rem 1.2rem;
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: var(--text);
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--highlight);
            box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.2);
        }
        
        .category-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1.2rem;
            margin-top: 0.8rem;
        }
        
        .category-option {
            background-color: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .category-option::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom right, rgba(233, 69, 96, 0.1), rgba(15, 52, 96, 0.1));
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .category-option:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: var(--highlight);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .category-option:hover::before {
            opacity: 1;
        }
        
        .category-option.selected {
            background-color: rgba(233, 69, 96, 0.2);
            border-color: var(--highlight);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
        }
        
        .category-option i {
            font-size: 2.2rem;
            margin-bottom: 0.8rem;
            color: var(--highlight);
            text-shadow: var(--glow);
        }
        
        .submit-btn {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(to right, var(--accent), var(--highlight));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        
        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, var(--highlight), var(--accent));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .submit-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(233, 69, 96, 0.5);
        }
        
        .submit-btn:hover::before {
            opacity: 1;
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .submit-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .message {
            padding: 1.2rem;
            border-radius: 10px;
            margin-top: 1.5rem;
            text-align: center;
            display: none;
            border-left: 4px solid;
        }
        
        .success-message {
            background-color: rgba(76, 175, 80, 0.2);
            border-color: var(--success);
            color: #a5d6a7;
        }
        
        .error-message {
            background-color: rgba(244, 67, 54, 0.2);
            border-color: var(--error);
            color: #ffabab;
        }
        
        .info-message {
            background-color: rgba(33, 150, 243, 0.2);
            border-color: #2196F3;
            color: #90caf9;
        }
        
        .warning-message {
            background-color: rgba(255, 152, 0, 0.2);
            border-color: var(--warning);
            color: #ffcc80;
        }
        
        .telegram-forward-status {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 2.5rem;
            margin-top: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            display: none;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }
        
        .telegram-forward-status::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, var(--accent), var(--highlight));
        }
        
        .telegram-forward-status h3 {
            color: var(--highlight);
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }
        
        .telegram-progress {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin: 2rem 0;
        }
        
        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
        }
        
        .step-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.5s;
            font-size: 1.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .step-icon.active {
            background: rgba(233, 69, 96, 0.3);
            border-color: var(--highlight);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
        }
        
        .step-icon.completed {
            background: rgba(76, 175, 80, 0.3);
            border-color: var(--success);
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.4);
        }
        
        .step-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: center;
            font-weight: 500;
        }
        
        .progress-connector {
            width: 80px;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            transition: background 0.5s;
            border-radius: 2px;
        }
        
        .progress-connector.completed {
            background: var(--success);
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }
        
        .telegram-status-text {
            margin-top: 1.5rem;
            font-size: 1.1rem;
            color: var(--text-secondary);
        }
        
        /* Admin Panel Styles */
        .admin-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.97);
            z-index: 1000;
            display: none;
            overflow-y: auto;
            padding: 2rem;
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .admin-title {
            font-size: 2.2rem;
            color: var(--highlight);
            text-shadow: var(--glow);
        }
        
        .close-admin {
            background: var(--error);
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(244, 67, 54, 0.3);
        }
        
        .close-admin:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(244, 67, 54, 0.4);
        }
        
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, the  1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }
        
        .stat-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: var(--shadow);
            transition: transform 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, var(--accent), var(--highlight));
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--highlight);
            margin-bottom: 0.5rem;
            text-shadow: var(--glow);
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 1rem;
        }
        
        .submissions-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 2.5rem;
            box-shadow: var(--shadow);
        }
        
        .submissions-table th,
        .submissions-table td {
            padding: 1.2rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .submissions-table th {
            background: rgba(15, 52, 96, 0.5);
            color: var(--highlight);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        
        .submissions-table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .action-btn {
            background: transparent;
            color: var(--highlight);
            border: 1px solid var(--highlight);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 0.5rem;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        
        .action-btn:hover {
            background: var(--highlight);
            color: white;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }
        
        .action-btn.delete {
            color: var(--error);
            border-color: var(--error);
        }
        
        .action-btn.delete:hover {
            background: var(--error);
            color: white;
            box-shadow: 0 0 10px rgba(244, 67, 54, 0.5);
        }
        
        .admin-actions {
            display: flex;
            gap: 1rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }
        
        .admin-btn {
            background: linear-gradient(to right, var(--accent), var(--highlight));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(233, 69, 96, 0.3);
        }
        
        .admin-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(233, 69, 96, 0.5);
        }
        
        .empty-admin-state {
            text-align: center;
            padding: 4rem;
            color: var(--text-secondary);
            font-size: 1.3rem;
        }

        .click-counter {
            position: fixed;
            bottom: 25px;
            ri
